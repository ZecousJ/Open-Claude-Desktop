name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Where
      options: [Desktop app, Web app, iOS app, Android app, Server, Runner, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or the commit you built from
  - type: input
    id: platform
    attributes:
      label: Platform
      description: For example macOS 26, Windows 11, Ubuntu 24.04, iOS 26
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, keys and anything personal first.
      render: text
