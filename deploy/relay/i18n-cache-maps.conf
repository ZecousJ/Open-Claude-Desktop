map $arg_v $claudex_i18n_uncached {
    default 1;
    "~^[0-9a-f]{12}$" 0;
}
map $claudex_i18n_uncached $claudex_i18n_version_cache {
    0 "public, max-age=31536000, immutable";
    default "public, max-age=300";
}
map $status $claudex_i18n_response_cache {
    default "no-store";
    200 $claudex_i18n_version_cache;
    304 $claudex_i18n_version_cache;
}
map $upstream_http_cache_control $claudex_i18n_cache_control {
    "" $claudex_i18n_response_cache;
    default "";
}
