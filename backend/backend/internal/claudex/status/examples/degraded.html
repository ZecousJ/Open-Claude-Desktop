<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑单车</title>
  <style>
    :root {
      --sky: #bfe9f5;
      --sky-deep: #8ed3e7;
      --road: #344653;
      --road-line: #f7d774;
      --green: #66a66c;
      --green-dark: #39704f;
      --coral: #ef765e;
      --yellow: #f4c95d;
      --ink: #20323c;
      --white: #fffdf7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #edf7f5;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .scene {
      position: relative;
      width: min(1120px, 100%);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 8px solid #ffffff;
      border-radius: 20px;
      background: var(--sky);
      box-shadow: 0 20px 60px rgba(35, 79, 89, 0.22);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 12px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .clouds {
      animation: drift 28s linear infinite;
    }

    .clouds.slow {
      animation-duration: 42s;
      animation-delay: -18s;
      opacity: 0.7;
    }

    .cloud {
      fill: rgba(255, 255, 255, 0.82);
    }

    .mountain-back {
      fill: #8ac5b1;
    }

    .mountain-front {
      fill: #5fa27b;
    }

    .ground {
      fill: var(--green);
    }

    .road {
      fill: var(--road);
    }

    .road-edge {
      fill: #263943;
    }

    .road-markings {
      animation: roadMove 1.6s linear infinite;
    }

    .road-marking {
      fill: var(--road-line);
    }

    .tree-group {
      animation: landscapeMove 12s linear infinite;
    }

    .tree-group.two {
      animation-delay: -6s;
    }

    .tree-trunk {
      fill: #76543e;
    }

    .tree-top {
      fill: var(--green-dark);
    }

    .bike-frame {
      fill: none;
      stroke: var(--coral);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bike-detail {
      fill: none;
      stroke: var(--ink);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wheel {
      fill: none;
      stroke: var(--ink);
      stroke-width: 7;
    }

    .wheel-spokes {
      fill: none;
      stroke: #72909a;
      stroke-width: 2;
    }

    .wheel-rotation {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheelSpin 0.72s linear infinite;
    }

    .pedal-rotation {
      transform-box: fill-box;
      transform-origin: center;
      animation: pedalSpin 1.1s linear infinite;
    }

    .pelican {
      animation: riderBounce 0.72s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .pelican-body {
      fill: var(--white);
      stroke: var(--ink);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .pelican-wing {
      fill: #e7f0ed;
      stroke: var(--ink);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .pelican-leg {
      fill: none;
      stroke: var(--ink);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pelican-beak {
      fill: var(--coral);
      stroke: var(--ink);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .pelican-eye {
      fill: var(--ink);
    }

    .pelican-hat {
      fill: var(--yellow);
      stroke: var(--ink);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .sun {
      fill: var(--yellow);
      stroke: #eaa64f;
      stroke-width: 4;
    }

    .caption {
      position: absolute;
      left: 28px;
      top: 22px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 2px solid rgba(32, 50, 60, 0.12);
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.86);
      color: var(--ink);
      font-size: clamp(14px, 2vw, 19px);
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 5px 15px rgba(32, 50, 60, 0.08);
    }

    .caption-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(239, 118, 94, 0.18);
    }

    @keyframes wheelSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pedalSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes riderBounce {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes roadMove {
      to {
        transform: translateX(-180px);
      }
    }

    @keyframes landscapeMove {
      to {
        transform: translateX(-1120px);
      }
    }

    @keyframes drift {
      to {
        transform: translateX(-700px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .scene {
        border-width: 5px;
        border-radius: 13px;
      }

      .caption {
        left: 14px;
        top: 14px;
        padding: 7px 10px;
      }
    }
  </style>
</head>
<body>
