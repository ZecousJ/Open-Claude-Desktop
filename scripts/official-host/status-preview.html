<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; frame-src about:; base-uri 'none'; form-action 'none'">
    <title>GPT IQ check</title>
    <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;display:block}</style>
  </head>
  <body>
    <script>
      function render(event) {
        if (parent === window || event.source !== parent || typeof event.data !== 'string') return;
        removeEventListener('message', render);
        const frame = document.createElement('iframe');
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.tabIndex = -1;
        frame.title = document.title;
        frame.srcdoc = '<!doctype html><style>html,body{overflow:hidden!important}</style>' + event.data;
        document.body.append(frame);
      }
      addEventListener('message', render);
    </script>
  </body>
</html>
