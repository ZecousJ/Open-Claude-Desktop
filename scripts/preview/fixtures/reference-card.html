<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthetic interface card</title>
<style>
  :root { box-sizing: border-box; --bg: #ffffff; --fg: #1a1a1a; --line: #d4d4d4;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1a1a; --fg: #f0f0f0; --line: #444; } }
  :root[data-theme="dark"] { --bg: #1a1a1a; --fg: #f0f0f0; --line: #444; }
  body { margin: 0; padding: 2rem; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  #count { font-size: 2.5rem; font-variant-numeric: tabular-nums; margin: 0 0 1rem; }
  button { font: inherit; padding: 0.5rem 1.25rem; border: 1px solid var(--line);
    border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button:hover { border-color: var(--fg); }
</style>
</head>
<body>
<h1>Reference card</h1>
<p id="count">0</p>
<button id="inc" type="button">Add 1</button>
<script>
  let n = 0;
  const out = document.getElementById("count");
  document.getElementById("inc").addEventListener("click", () => { n += 1; out.textContent = n; });
</script>
</body>
</html>
