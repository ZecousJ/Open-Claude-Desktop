<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Remote control</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a65"/></marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#faf9f5"/>
  <g font-size="13" fill="#141413">
    <rect x="30" y="40" width="280" height="280" rx="14" fill="#fff" stroke="#d6d4cc"/>
    <text x="52" y="72" font-size="16" font-weight="600">Your computer</text>
    <text x="52" y="96" fill="#52514e">Claudex desktop, Remote Control on</text>
    <rect x="52" y="118" width="236" height="56" rx="10" fill="#f3f1ea"/>
    <text x="68" y="142" font-weight="600">Code sessions</text>
    <text x="68" y="162" fill="#52514e">local folders, terminal, Git</text>
    <rect x="52" y="188" width="236" height="56" rx="10" fill="#f3f1ea"/>
    <text x="68" y="212" font-weight="600">Chats on this computer</text>
    <text x="68" y="232" fill="#52514e">its files and connectors</text>
    <text x="52" y="282" fill="#52514e">Work stays here; nothing is</text>
    <text x="52" y="300" fill="#52514e">copied to the server's sandbox.</text>

    <rect x="370" y="110" width="220" height="140" rx="14" fill="#fbf1ec" stroke="#c2562f" stroke-width="1.4"/>
    <text x="392" y="142" font-size="16" font-weight="600">Claudex server</text>
    <text x="392" y="168" fill="#52514e">device list per account</text>
    <text x="392" y="190" fill="#52514e">relays messages, events</text>
    <text x="392" y="212" fill="#52514e">and approvals</text>

    <rect x="650" y="40" width="280" height="280" rx="14" fill="#fff" stroke="#d6d4cc"/>
    <text x="672" y="72" font-size="16" font-weight="600">Phone or browser</text>
    <text x="672" y="104">1. Pick an online computer</text>
    <text x="672" y="132">2. Open one of its sessions</text>
    <text x="672" y="160">3. Send, stop, approve</text>
    <text x="672" y="188" fill="#52514e">or start a new session there</text>
    <text x="672" y="282" fill="#52514e">The computer can require each phone</text>
    <text x="672" y="300" fill="#52514e">or browser to be trusted first.</text>
  </g>
  <g stroke="#6b6a65" stroke-width="1.6" fill="none">
    <path d="M314 180H366" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M594 180H646" marker-end="url(#a)" marker-start="url(#a)"/>
  </g>
  <text x="318" y="170" font-size="11" fill="#6b6a65">device link</text>
  <text x="598" y="170" font-size="11" fill="#6b6a65">HTTPS · WSS</text>
</svg>
